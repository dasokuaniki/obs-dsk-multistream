name: Windows build and release signing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      DSK_OAUTH_APP_CONFIG_JSON: ${{ secrets.DSK_OAUTH_APP_CONFIG_JSON }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_RELEASE_SIGNING_APPROVED: ${{ vars.SIGNPATH_RELEASE_SIGNING_APPROVED }}
      SIGNPATH_EXPECTED_SIGNER_THUMBPRINT: ${{ vars.SIGNPATH_EXPECTED_SIGNER_THUMBPRINT }}
      SIGNPATH_UNINSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_UNINSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_PLUGIN_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_PLUGIN_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read build metadata
        id: metadata
        shell: pwsh
        run: |
          $spec = Get-Content -LiteralPath buildspec.json -Raw | ConvertFrom-Json
          if ($spec.version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid semantic version: $($spec.version)"
          }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v') -and $env:GITHUB_REF_NAME -ne "v$($spec.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match build version v$($spec.version)."
          }
          "version=$($spec.version)" >> $env:GITHUB_OUTPUT
          "installer=DSK-Multistream-$($spec.version)-Windows-x64-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Prepare publisher OAuth build input
        id: oauth
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DSK_OAUTH_APP_CONFIG_JSON)) {
            "configured=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $oauthPath = Join-Path $env:RUNNER_TEMP 'dsk-oauth-app-config.json'
          [IO.File]::WriteAllText($oauthPath, $env:DSK_OAUTH_APP_CONFIG_JSON, [Text.UTF8Encoding]::new($false))
          $parsed = Get-Content -LiteralPath $oauthPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$parsed.youtube.clientId) -or
              [string]::IsNullOrWhiteSpace([string]$parsed.youtube.clientSecret)) {
            throw 'DSK_OAUTH_APP_CONFIG_JSON must contain youtube.clientId and youtube.clientSecret.'
          }
          "configured=true" >> $env:GITHUB_OUTPUT
          "path=$oauthPath" >> $env:GITHUB_OUTPUT

      - name: Determine release-signing mode
        id: signing
        shell: pwsh
        run: |
          . scripts/signpath-ci.ps1
          $mode = Get-SignPathSigningMode -Ref $env:GITHUB_REF -PublisherOAuthConfigured:('${{ steps.oauth.outputs.configured }}' -eq 'true') -Inputs @{
            ReleaseSigningApproved = $env:SIGNPATH_RELEASE_SIGNING_APPROVED
            ApiToken = $env:SIGNPATH_API_TOKEN
            OrganizationId = $env:SIGNPATH_ORGANIZATION_ID
            ProjectSlug = $env:SIGNPATH_PROJECT_SLUG
            SigningPolicySlug = $env:SIGNPATH_SIGNING_POLICY_SLUG
            PluginConfigurationSlug = $env:SIGNPATH_PLUGIN_ARTIFACT_CONFIGURATION_SLUG
            UninstallerConfigurationSlug = $env:SIGNPATH_UNINSTALLER_ARTIFACT_CONFIGURATION_SLUG
            InstallerConfigurationSlug = $env:SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG
            ExpectedSignerThumbprint = $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT
          }
          "enabled=$($mode.Enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "unsigned-label=$($mode.UnsignedArtifactLabel)" >> $env:GITHUB_OUTPUT
          if (-not $mode.Enabled -and $env:GITHUB_REF.StartsWith('refs/tags/v')) {
            Write-Warning 'SignPath release signing is inactive. This artifact is unsigned and not approved for distribution.'
          }

      - name: Install pinned Inno Setup
        id: inno
        shell: pwsh
        run: |
          $version = '6.7.3'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          # Upstream immutable release asset digest, also published in its .issig.
          $expectedSha256 = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          $downloadPath = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          $toolRoot = Join-Path $env:RUNNER_TEMP "inno-setup-$version"
          Invoke-WebRequest -Uri $url -OutFile $downloadPath
          if ((Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash -ne $expectedSha256) {
            throw 'The pinned Inno Setup download hash does not match.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $downloadPath
          if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid -or
              -not $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Pyrsys B.V.') {
            throw 'The pinned Inno Setup download must have a valid upstream signature and timestamp.'
          }
          $process = Start-Process -FilePath $downloadPath -ArgumentList @(
            '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=`"$toolRoot`""
          ) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }
          $iscc = Join-Path $toolRoot 'ISCC.exe'
          # ISCC.exe has no useful PE version; load the compiler with a no-output probe.
          $probe = @('[Setup]', 'AppName=DSK CI compiler check', 'AppVersion=0',
            'CreateAppDir=no', 'Uninstallable=no', 'Output=no', "OutputDir=$toolRoot")
          $compilerOutput = ($probe | & $iscc '-' 2>&1 | Out-String)
          $compilerExitCode = $LASTEXITCODE
          $compilerVersionMatch = [regex]::Match($compilerOutput, 'Compiler engine version: Inno Setup (\d+\.\d+\.\d+)')
          if ($compilerExitCode -ne 0 -or -not $compilerVersionMatch.Success -or $compilerVersionMatch.Groups[1].Value -ne $version) {
            Write-Host $compilerOutput
            throw "Installed ISCC did not report required version $version (exit $compilerExitCode)."
          }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Verified Inno Setup $version at $iscc"

      - name: Configure clean Windows build
        shell: pwsh
        run: |
          $arguments = @('--preset', 'windows-ci-x64')
          $publisherReleaseFlag = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { 'ON' } else { 'OFF' }
          $arguments += "-DDSK_PUBLISHER_RELEASE=$publisherReleaseFlag"
          if ('${{ steps.oauth.outputs.configured }}' -eq 'true') {
            $arguments += "-DDSK_OAUTH_APP_CONFIG=${{ steps.oauth.outputs.path }}"
          } else {
            $arguments += '-DDSK_OAUTH_APP_CONFIG='
          }
          cmake @arguments

      - name: Build plugin
        shell: pwsh
        run: cmake --build --preset windows-ci-x64 --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/windows-ci-x64 -C RelWithDebInfo --output-on-failure

      - name: Validate plugin metadata
        id: plugin
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'build/windows-ci-x64/RelWithDebInfo/obs-dsk-multistream.dll').Path
          $versionInfo = (Get-Item -LiteralPath $dll).VersionInfo
          $expected = '${{ steps.metadata.outputs.version }}.0'
          if ($versionInfo.ProductName -ne 'DSK Multistream' -or
              $versionInfo.ProductVersion -ne $expected -or
              $versionInfo.FileVersion -ne $expected -or
              $versionInfo.OriginalFilename -ne 'obs-dsk-multistream.dll') {
            throw "Unexpected plugin version metadata: $($versionInfo | Format-List | Out-String)"
          }
          $input = Join-Path $env:GITHUB_WORKSPACE 'build/signing-input/plugin'
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          Copy-Item -LiteralPath $dll -Destination (Join-Path $input 'obs-dsk-multistream.dll') -Force
          "dll=$dll" >> $env:GITHUB_OUTPUT

      - name: Stage publisher signing input
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          & scripts/external-windows-signing.ps1 -Phase StagePlugin -BuildDir build/windows-ci-x64 -WorkDir build/signpath-ci -OutputDir build/signpath-verified -IsccPath '${{ steps.inno.outputs.iscc }}' -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT

      - name: Upload unsigned plugin for origin verification
        id: upload_plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsk-plugin-unsigned-${{ github.sha }}
          path: build/signing-input/plugin/obs-dsk-multistream.dll
          if-no-files-found: error
          retention-days: 7

      - name: Submit plugin signing request
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PLUGIN_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_plugin.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/build/signed-plugin
          parameters: |
            version: "${{ steps.metadata.outputs.version }}"

      - name: Use and verify signed plugin
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          . scripts/signpath-ci.ps1
          $destination = 'build/signpath-ci/signed-build/obs-dsk-multistream.dll'
          Copy-SignPathSignedFile -Directory build/signed-plugin -FileName obs-dsk-multistream.dll -Destination $destination -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT

      - name: Prepare unsigned uninstaller
        id: uninstaller
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          & scripts/external-windows-signing.ps1 -Phase PrepareUninstaller -WorkDir build/signpath-ci -IsccPath '${{ steps.inno.outputs.iscc }}' -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT
          $files = @(Get-ChildItem -LiteralPath build/signpath-ci/signed-uninstaller -File -Filter '*.e32')
          if ($files.Count -ne 1 -or $files[0].Name -notmatch '^uninst-[0-9A-Za-z._-]+\.e32$') {
            throw 'Expected exactly one safe Inno uninstaller filename.'
          }
          $input = Join-Path $env:GITHUB_WORKSPACE 'build/signing-input/uninstaller'
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          $copy = Join-Path $input $files[0].Name
          Copy-Item -LiteralPath $files[0].FullName -Destination $copy
          if ((Get-FileHash -LiteralPath $copy).Hash -ne (Get-FileHash -LiteralPath $files[0].FullName).Hash) {
            throw 'Uninstaller upload copy changed.'
          }
          "name=$($files[0].Name)" >> $env:GITHUB_OUTPUT
          # The validated first Inno pass intentionally exits nonzero to hand off .e32.
          # GitHub pwsh must not propagate that expected native exit code.
          $global:LASTEXITCODE = 0

      - name: Upload unsigned uninstaller for origin verification
        id: upload_uninstaller
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsk-uninstaller-unsigned-${{ github.sha }}
          path: build/signing-input/uninstaller/${{ steps.uninstaller.outputs.name }}
          if-no-files-found: error
          retention-days: 7

      - name: Submit uninstaller signing request
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_UNINSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_uninstaller.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/build/signed-uninstaller
          parameters: |
            version: "${{ steps.metadata.outputs.version }}"
            uninstaller: "${{ steps.uninstaller.outputs.name }}"

      - name: Use and verify signed uninstaller
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          . scripts/signpath-ci.ps1
          $name = '${{ steps.uninstaller.outputs.name }}'
          Copy-SignPathSignedFile -Directory build/signed-uninstaller -FileName $name -Destination (Join-Path build/signpath-ci/signed-uninstaller $name) -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT

      - name: Build installer
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            & scripts/external-windows-signing.ps1 -Phase BuildInstaller -WorkDir build/signpath-ci -IsccPath '${{ steps.inno.outputs.iscc }}' -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT
          } else {
            & scripts/build-windows-installer.ps1 -BuildDir build/windows-ci-x64 -Configuration RelWithDebInfo -IsccPath '${{ steps.inno.outputs.iscc }}'
          }

      - name: Validate installer metadata
        shell: pwsh
        run: |
          $directory = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { 'build/signpath-ci/installer' } else { 'release' }
          $installer = Join-Path $directory '${{ steps.metadata.outputs.installer }}'
          $versionInfo = (Get-Item -LiteralPath $installer).VersionInfo
          $expected = '${{ steps.metadata.outputs.version }}.0'
          if ($versionInfo.ProductName.Trim() -ne 'DSK Multistream' -or
              $versionInfo.ProductVersion.Trim() -ne $expected -or
              $versionInfo.FileVersion.Trim() -ne $expected) {
            throw "Unexpected installer version metadata: $($versionInfo | Format-List | Out-String)"
          }
          $input = Join-Path $env:GITHUB_WORKSPACE 'build/signing-input/installer'
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $input '${{ steps.metadata.outputs.installer }}') -Force

      - name: Upload unsigned installer for origin verification
        id: upload_installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dsk-installer-unsigned-${{ github.sha }}
          path: build/signing-input/installer/${{ steps.metadata.outputs.installer }}
          if-no-files-found: error
          retention-days: 7

      - name: Submit installer signing request
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/build/signed-installer
          parameters: |
            version: "${{ steps.metadata.outputs.version }}"

      - name: Verify and assemble final artifact
        id: assemble
        shell: pwsh
        run: |
          $name = '${{ steps.metadata.outputs.installer }}'
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            . scripts/signpath-ci.ps1
            $workingInstaller = Join-Path build/signpath-ci/installer $name
            Copy-SignPathSignedFile -Directory build/signed-installer -FileName $name -Destination $workingInstaller -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT
            & scripts/external-windows-signing.ps1 -Phase VerifyRelease -WorkDir build/signpath-ci -OutputDir build/signpath-verified -ExpectedSignerThumbprint $env:SIGNPATH_EXPECTED_SIGNER_THUMBPRINT
            $releaseInstaller = Join-Path build/signpath-verified $name
            # Signatures do not certify Defender or the installation lifecycle.
            $artifactLabel = 'signed-candidate'
          } else {
            $releaseInstaller = Join-Path release $name
            $artifactLabel = '${{ steps.signing.outputs.unsigned-label }}'
          }
          $hash = (Get-FileHash -LiteralPath $releaseInstaller -Algorithm SHA256).Hash
          [IO.File]::WriteAllText("$releaseInstaller.sha256", "$hash *$name`r`n", [Text.ASCIIEncoding]::new())
          "installer=$releaseInstaller" >> $env:GITHUB_OUTPUT
          "artifact-label=$artifactLabel" >> $env:GITHUB_OUTPUT

      - name: Upload final Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: DSK-Multistream-${{ steps.metadata.outputs.version }}-Windows-x64-${{ steps.assemble.outputs.artifact-label }}
          path: |
            ${{ steps.assemble.outputs.installer }}
            ${{ steps.assemble.outputs.installer }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary OAuth input
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'dsk-oauth-app-config.json') -Force -ErrorAction SilentlyContinue
